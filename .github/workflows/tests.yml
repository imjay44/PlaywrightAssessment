name: Northline Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *" # Nightly run at 02:00 UTC
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & System Dependencies
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Run Smoke Tests (Fail-Fast)
        run: |
          pytest -m smoke --browser ${{ matrix.browser }} --base-url https://ecomcicid.netlify.app

      - name: Run Full Regression Suite
        if: success()
        run: |
          pytest -n auto --browser ${{ matrix.browser }} --base-url https://ecomcicid.netlify.app

      - name: Upload Reports and Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.browser }}
          path: |
            reports/
            test-results/
